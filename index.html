<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Daily Docket — Task Planner</title>
<meta name="description" content="A card-catalog styled daily planner and to-do list.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20232B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Docket">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --desk: #20232B;
    --desk-2: #262A34;
    --card: #F1E9D2;
    --card-shadow: #17181D;
    --ink: #26241E;
    --ink-muted: #6B6656;
    --pin-red: #B33A3A;
    --teal: #3F7168;
    --gold: #C9A24B;
    --line: rgba(38,36,30,0.14);
    --deskline: #33384380;
    --max: 900px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, #2A2E38, var(--desk));
    color: var(--card);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 80px;
  }

  a{ color:inherit; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 24px; }

  /* -------- HEADER -------- */
  header{ padding: 56px 0 34px; text-align:center; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }
  header h1{
    font-family: 'Special Elite', monospace;
    font-size: clamp(2rem, 5.5vw, 3.2rem);
    color: #F1E9D2;
    letter-spacing: 0.01em;
  }
  header .date{
    font-family:'JetBrains Mono', monospace;
    color: #8A8FA0;
    font-size: 0.85rem;
    margin-top: 10px;
  }

  /* -------- STATS DRAWER -------- */
  .drawer{
    display:flex;
    justify-content:center;
    gap: 0;
    margin: 34px auto 0;
    max-width: 560px;
    background: var(--desk-2);
    border: 1px solid var(--deskline);
    border-radius: 8px;
    overflow:hidden;
  }
  .drawer .stat{
    flex:1;
    text-align:center;
    padding: 16px 10px;
    border-right: 1px solid var(--deskline);
  }
  .drawer .stat:last-child{ border-right:none; }
  .drawer .stat .n{
    font-family:'Special Elite', monospace;
    font-size: 1.5rem;
    color: var(--gold);
  }
  .drawer .stat .l{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8A8FA0;
    margin-top: 4px;
  }

  .progress-track{
    max-width: 560px;
    margin: 14px auto 0;
    height: 6px;
    background: var(--desk-2);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--deskline);
  }
  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    width: 0%;
    transition: width .4s ease;
  }

  /* -------- ADD FORM -------- */
  .add-card{
    max-width: 720px;
    margin: 46px auto 0;
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
    box-shadow: 0 14px 0 -6px var(--card-shadow), 0 18px 30px rgba(0,0,0,0.35);
    padding: 26px 26px 22px;
    position: relative;
  }
  .add-card::before{
    content:"";
    position:absolute;
    top: -9px; left: 28px;
    width: 18px; height: 18px;
    background: var(--pin-red);
    border-radius: 50%;
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  .add-card .label{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 6px;
    display:block;
  }
  .add-row{ display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .add-row.top{ flex-wrap: nowrap; }
  input[type=text], input[type=date], select{
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    background: #FBF7E9;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 12px;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus{
    border-color: var(--teal);
  }
  #task-input{ flex: 1; min-width: 180px; }
  #due-input{ width: 155px; }
  #priority-input, #category-input{ width: 140px; }

  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    padding: 11px 20px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .18s ease;
  }
  .btn-add{
    background: var(--teal);
    color: #F1E9D2;
    font-weight: 600;
  }
  .btn-add:hover{ background: #345d55; }

  /* -------- TABS / FILTERS -------- */
  .controls{
    max-width: 720px;
    margin: 30px auto 0;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .tabs{ display:flex; gap: 6px; }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--deskline);
    background: transparent;
    color: #8A8FA0;
    cursor: pointer;
    transition: all .18s ease;
  }
  .tab.active, .tab:hover{
    border-color: var(--gold);
    color: var(--gold);
  }
  #search-input{
    background: var(--desk-2);
    border: 1px solid var(--deskline);
    color: #F1E9D2;
    width: 200px;
  }
  #search-input::placeholder{ color: #6B7080; }

  .clear-btn{
    background: transparent;
    color: #8A8FA0;
    border: 1px solid var(--deskline);
  }
  .clear-btn:hover{ color: var(--pin-red); border-color: var(--pin-red); }

  /* -------- TASK LIST -------- */
  #task-list{
    max-width: 720px;
    margin: 26px auto 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .task-card{
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
    padding: 16px 18px;
    display:flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 8px 0 -5px var(--card-shadow), 0 10px 18px rgba(0,0,0,0.28);
    position: relative;
    animation: cardIn .25s ease;
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .task-card.done{ opacity: 0.55; }
  .task-card.done .task-title{ text-decoration: line-through; }
  .task-card.overdue:not(.done){ border-left: 4px solid var(--pin-red); padding-left: 14px; }

  .check{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--teal);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    background: transparent;
    transition: background .15s;
  }
  .check.checked{ background: var(--teal); }
  .check.checked::after{
    content: "✓";
    color: #F1E9D2;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .task-body{ flex: 1; min-width: 0; }
  .task-title{
    font-size: 1rem;
    font-weight: 500;
    word-break: break-word;
  }
  .task-meta{
    display:flex; flex-wrap:wrap; gap: 8px;
    margin-top: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
  }
  .meta-pill{
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-muted);
  }
  .meta-pill.due{ color: var(--ink); }
  .meta-pill.overdue-tag{ background: var(--pin-red); color: #FBF7E9; border-color: var(--pin-red); }
  .meta-pill.pr-high{ background: var(--pin-red); color: #FBF7E9; border-color: var(--pin-red); }
  .meta-pill.pr-medium{ background: var(--gold); color: #26241E; border-color: var(--gold); }
  .meta-pill.pr-low{ background: transparent; }

  .task-actions{ display:flex; gap: 8px; flex-shrink:0; }
  .icon-btn{
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink-muted);
    font-size: 0.95rem;
    padding: 4px;
    transition: color .15s;
  }
  .icon-btn:hover{ color: var(--pin-red); }
  .icon-btn.edit-btn:hover{ color: var(--teal); }

  .empty-state{
    max-width: 720px;
    margin: 50px auto 0;
    text-align:center;
    color: #6B7080;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.85rem;
    padding: 40px 20px;
    border: 1px dashed var(--deskline);
    border-radius: 8px;
  }

  footer{
    text-align:center;
    margin-top: 70px;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: #565B68;
  }

  @media (max-width: 560px){
    .add-row.top{ flex-wrap: wrap; }
    #due-input, #priority-input, #category-input{ width: 100%; }
    .controls{ flex-direction: column; align-items: stretch; }
    #search-input{ width: 100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .task-card{ animation: none; }
  }

  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Card Catalog · Task Index</div>
  <h1>The Daily Docket</h1>
  <div class="date" id="today-date"></div>

  <div class="drawer">
    <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Filed</div></div>
    <div class="stat"><div class="n" id="stat-active">0</div><div class="l">Open</div></div>
    <div class="stat"><div class="n" id="stat-done">0</div><div class="l">Closed</div></div>
    <div class="stat"><div class="n" id="stat-pct">0%</div><div class="l">Cleared</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</header>

<div class="wrap">

  <form class="add-card" id="add-form" autocomplete="off">
    <span class="label">New Entry</span>
    <div class="add-row top">
      <input type="text" id="task-input" placeholder="What needs doing?" maxlength="140" required>
      <button type="submit" class="btn btn-add">+ File Task</button>
    </div>
    <div class="add-row">
      <div>
        <span class="label">Due</span>
        <input type="date" id="due-input">
      </div>
      <div>
        <span class="label">Priority</span>
        <select id="priority-input">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div>
        <span class="label">Category</span>
        <select id="category-input">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </form>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="active">Open</button>
      <button class="tab" data-filter="done">Closed</button>
      <button class="tab" data-filter="overdue">Overdue</button>
    </div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="search-input" placeholder="Search entries…">
      <button class="btn clear-btn" id="clear-done">Clear Closed</button>
    </div>
  </div>

  <div id="task-list"></div>
  <div class="empty-state" id="empty-state" style="display:none;">The drawer is empty. File a new task above.</div>

</div>

<footer>Built with HTML, CSS &amp; JS · Data saved locally in your browser</footer>

<script>
(function(){
  const STORAGE_KEY = 'daily-docket-tasks-v1';
  let tasks = [];
  let currentFilter = 'all';
  let searchTerm = '';
  let editingId = null;

  // ---- date header ----
  document.getElementById('today-date').textContent =
    new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  // ---- storage ----
  function loadTasks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error('Could not load saved tasks:', e);
      tasks = [];
    }
  }
  function saveTasks(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }catch(e){
      console.error('Could not save tasks:', e);
    }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function isOverdue(t){
    if(!t.due || t.done) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(t.due + 'T00:00:00');
    return due < today;
  }

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  // ---- render ----
  const listEl = document.getElementById('task-list');
  const emptyEl = document.getElementById('empty-state');

  function render(){
    let visible = tasks.slice();

    if(currentFilter === 'active') visible = visible.filter(t => !t.done);
    else if(currentFilter === 'done') visible = visible.filter(t => t.done);
    else if(currentFilter === 'overdue') visible = visible.filter(t => isOverdue(t));

    if(searchTerm.trim()){
      const s = searchTerm.trim().toLowerCase();
      visible = visible.filter(t => t.title.toLowerCase().includes(s) || (t.category||'').toLowerCase().includes(s));
    }

    // sort: open first, then by due date (soonest first, no-date last), then by creation
    visible.sort((a,b)=>{
      if(a.done !== b.done) return a.done ? 1 : -1;
      if(a.due && b.due) return a.due.localeCompare(b.due);
      if(a.due) return -1;
      if(b.due) return 1;
      return a.created - b.created;
    });

    listEl.innerHTML = '';
    emptyEl.style.display = visible.length ? 'none' : 'block';

    visible.forEach(t => {
      const card = document.createElement('div');
      card.className = 'task-card' + (t.done ? ' done' : '') + (isOverdue(t) ? ' overdue' : '');

      const check = document.createElement('button');
      check.className = 'check' + (t.done ? ' checked' : '');
      check.setAttribute('aria-label', t.done ? 'Mark as open' : 'Mark as done');
      check.onclick = () => { t.done = !t.done; saveTasks(); render(); };

      const body = document.createElement('div');
      body.className = 'task-body';

      if(editingId === t.id){
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.value = t.title;
        editInput.className = 'edit-input';
        editInput.style.width = '100%';
        editInput.style.padding = '8px 10px';
        editInput.style.border = '1px solid #3F7168';
        editInput.style.borderRadius = '3px';
        editInput.style.fontFamily = "'Work Sans', sans-serif";
        editInput.maxLength = 140;
        editInput.onkeydown = (e) => {
          if(e.key === 'Enter'){ commitEdit(t, editInput.value); }
          if(e.key === 'Escape'){ editingId = null; render(); }
        };
        body.appendChild(editInput);
        setTimeout(()=>{ editInput.focus(); editInput.select(); }, 0);
      } else {
        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = t.title;
        body.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'task-meta';

        if(t.due){
          const duePill = document.createElement('span');
          duePill.className = 'meta-pill due' + (isOverdue(t) ? ' overdue-tag' : '');
          duePill.textContent = (isOverdue(t) ? 'Overdue · ' : 'Due ') + fmtDate(t.due);
          meta.appendChild(duePill);
        }
        const prPill = document.createElement('span');
        prPill.className = 'meta-pill pr-' + t.priority;
        prPill.textContent = t.priority.charAt(0).toUpperCase() + t.priority.slice(1);
        meta.appendChild(prPill);

        if(t.category){
          const catPill = document.createElement('span');
          catPill.className = 'meta-pill';
          catPill.textContent = t.category;
          meta.appendChild(catPill);
        }
        body.appendChild(meta);
      }

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn edit-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.textContent = '✎';
      editBtn.onclick = () => { editingId = (editingId === t.id) ? null : t.id; render(); };

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.setAttribute('aria-label', 'Delete task');
      delBtn.textContent = '✕';
      delBtn.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); saveTasks(); render(); };

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      card.appendChild(check);
      card.appendChild(body);
      card.appendChild(actions);
      listEl.appendChild(card);
    });

    updateStats();
  }

  function commitEdit(t, newTitle){
    const trimmed = newTitle.trim();
    if(trimmed) t.title = trimmed;
    editingId = null;
    saveTasks();
    render();
  }

  function updateStats(){
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct = total ? Math.round((done/total)*100) : 0;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  // ---- form ----
  document.getElementById('add-form').addEventListener('submit', function(e){
    e.preventDefault();
    const titleInput = document.getElementById('task-input');
    const dueInput = document.getElementById('due-input');
    const priorityInput = document.getElementById('priority-input');
    const categoryInput = document.getElementById('category-input');

    const title = titleInput.value.trim();
    if(!title) return;

    tasks.push({
      id: uid(),
      title: title,
      due: dueInput.value || null,
      priority: priorityInput.value,
      category: categoryInput.value,
      done: false,
      created: Date.now()
    });

    saveTasks();
    titleInput.value = '';
    dueInput.value = '';
    priorityInput.value = 'medium';
    titleInput.focus();
    render();
  });

  // ---- tabs ----
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // ---- search ----
  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });

  // ---- clear completed ----
  document.getElementById('clear-done').addEventListener('click', () => {
    if(!tasks.some(t => t.done)) return;
    if(confirm('Remove all closed tasks? This cannot be undone.')){
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
    }
  });

  loadTasks();
  render();
})();

// Register service worker so the app works offline once installed
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((e) => {
      console.warn('Service worker registration failed:', e);
    });
  });
}
</script>

</body>
</html>
